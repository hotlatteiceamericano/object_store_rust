# fly.toml app configuration file generated for object-store-rust on 2026-02-26T12:58:10+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'object-store-rust'
primary_region = 'nrt'

[build]

[env]
  DB_PATH = '/data/db'
  STORE_PATH = '/data/store'

[[mounts]]
  source = 'app_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
